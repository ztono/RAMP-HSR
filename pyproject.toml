[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ramp-hsr"
version = "1.0.0"
description = "Hidden-state MLP repair with an independent risk-route audit"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "transformers==4.57.6",
  "accelerate==1.14.0",
  "huggingface-hub==0.36.2",
  "safetensors==0.8.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
completion = ["codebleu==0.7.0", "tree-sitter==0.22.3", "tree-sitter-python==0.21.0", "rapidfuzz>=3.0"]

[tool.setuptools.packages.find]
include = ["ramp_hsr*", "scripts*"]

